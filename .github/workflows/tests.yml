name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Formatting
        run: ruff format --check custom_components tests
      - name: Tests with Home Assistant and a Modbus TCP simulator
        run: pytest -q --cov=custom_components.schneider_pm --cov-report=term-missing
